name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, doc (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: make fmt-check
      - name: Clippy
        run: make lint
      - name: Test
        run: make test
      - name: Doc
        run: make doc

  features:
    name: feature sets (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The library alone is checked without dev-dependencies, whose
      # features unify into every test build.
      - name: Library, no default features
        run: cargo check --locked --no-default-features --lib
      - name: Library, instruments only
        run: cargo check --locked --no-default-features --features instruments --lib
      - name: Tests, no default features
        run: cargo test --locked --no-default-features
      - name: Tests, instruments only
        run: cargo test --locked --no-default-features --features instruments

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `make msrv` runs `cargo +1.88.0`, which overrides rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Check
        run: make msrv
