[package]
name = "margin-rs"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
authors = ["Joaquin Bejar <jb@taunais.com>"]
description = "Risk and margin engine: accounting, pretrade risk and margin for market making"
license = "MIT"
readme = "README.md"
repository = "https://github.com/joaquinbejar/margin-rs"
homepage = "https://github.com/joaquinbejar/margin-rs"
keywords = ["finance", "margin", "risk", "trading"]
categories = ["finance"]
include = [
    "/src/**/*",
    "/tests/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/docs/*.md",
    "/LICENSE",
    "/Makefile",
    "/rust-toolchain.toml",
]

[lib]
name = "margin_rs"
path = "src/lib.rs"

[dependencies]
financial_types = "0.3.1"
thiserror = "2.0"
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }

[dev-dependencies]
rust_decimal_macros = "1.40"
# The shared, hand computed instrument fixtures (tests/instrument_fixtures.rs).
financial_types = { version = "0.3.1", features = ["fixtures"] }

[features]
default = []
# Conversion of a `financial_types` instrument specification into an
# `Instrument` (`Instrument::from_spec`).
instruments = ["financial_types/instruments"]

# The target lint set is a minimum: lints that were already forbid or deny
# stay at that level.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
# Money, prices and quantities use exact decimal arithmetic; no binary floats.
float_arithmetic = "deny"
