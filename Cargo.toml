[package]
name = "margin-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Joaquin Bejar <jb@taunais.com>"]
description = "Risk and margin engine: accounting, pretrade risk and margin for market making"
license = "MIT"
readme = "README.md"
repository = "https://github.com/joaquinbejar/margin-rs"
homepage = "https://github.com/joaquinbejar/margin-rs"
keywords = ["finance", "margin", "risk", "trading"]
categories = ["finance"]
# Not published: releases need their own scope (MAR-00 release_policy).
publish = false
include = [
    "src/**/*",
    "tests/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "Makefile",
    "rust-toolchain.toml",
]

[lib]
name = "margin_rs"
path = "src/lib.rs"

[dependencies]
financial_types = "0.3"
thiserror = "2.0"
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }

[dev-dependencies]
rust_decimal_macros = "1.40"

[features]
default = []

# The target lint set is a minimum: lints that were already forbid or deny
# stay at that level.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
# Money, prices and quantities use exact decimal arithmetic; no binary floats.
float_arithmetic = "deny"
